<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPoets Full Stack Developer Test</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css?v=10" rel="stylesheet">
</head>
<body>

    <section class="delphian-section">
        <div class="container text-center mb-3 header-text">
            <h2>DelphianLogic in Action</h2>
            <p>Lorem ipsum dolor sit amet, consectetuer adipiscing elit. Aenean commodo</p>
        </div>

        <div class="container main-container">
            <!-- Desktop View -->
            <div class="row g-0 desktop-view d-none d-md-flex">
                <!-- Column 1: Tabs -->
                <div class="col-md-3 col-tabs">
                    <div class="list-group list-group-flush" id="desktopTabs" role="tablist">
                        <!-- Tabs will be injected here via JS -->
                    </div>
                </div>
                
                <!-- Column 2: Content Slider -->
                <div class="col-md-5 col-content d-flex flex-column justify-content-center position-relative">
                    <div class="slider-content p-5 text-white" id="desktopContent">
                        <!-- Content injected here via JS -->
                    </div>
                    
                    <!-- Slider dots -->
                    <div class="slider-dots text-center position-absolute w-100" style="bottom: 20px;">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
                
                <!-- Column 3: Image -->
                <div class="col-md-4 col-image">
                    <div class="image-wrapper h-100 w-100" id="desktopImage">
                        <!-- Image background injected here via JS -->
                    </div>
                </div>
            </div>

            <!-- Mobile View (Accordion + Slider) -->
            <div class="mobile-view d-block d-md-none" id="mobileAccordion">
                <!-- Accordion items injected here via JS -->
            </div>
        </div>
    </section>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>
</body>
</html>
