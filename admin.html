<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - DelphianLogic</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables JS -->
    <script type="text/javascript" src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    
    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-custom {
            background-color: #1e3b56;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn-custom {
            background-color: #70b8c8;
            color: #fff;
            border: none;
            transition: all 0.3s;
        }
        .btn-custom:hover {
            background-color: #5a9ca8;
            color: #fff;
        }
        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.05);
        }
        .card-header-custom {
            background-color: #fff;
            border-bottom: 1px solid #f0f2f5;
            border-top-left-radius: 10px !important;
            border-top-right-radius: 10px !important;
        }
        .table-custom th {
            color: #6c757d;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            border-top: none;
        }
        .table-custom td {
            vertical-align: middle;
            color: #495057;
        }
        
        /* Modal & Form Styles */
        .modal-content {
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }
        .modal-header {
            background-color: #1e3b56;
            color: #fff;
            border-bottom: none;
        }
        .modal-header .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }
        .upload-area {
            border: 2px dashed #70b8c8;
            border-radius: 10px;
            padding: 30px 20px;
            text-align: center;
            background: #f8fbff;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            background: #eef5ff;
            border-color: #5a9ca8;
        }
        .upload-area input[type="file"] {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
        }
        .preview-img {
            max-height: 150px;
            display: none;
            margin-top: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                DelphianLogic <span style="font-weight: 300; opacity: 0.8;">| Admin Portal</span>
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm">View Live Site</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5 mb-5">
        <div class="card card-custom">
            <div class="card-header card-header-custom d-flex justify-content-between align-items-center py-4 px-4">
                <h5 class="mb-0 fw-bold" style="color: #1e3b56;">Manage Slides</h5>
                <button class="btn btn-custom px-4 fw-bold shadow-sm" onclick="openCreateModal()">
                    + Create New Slide
                </button>
            </div>
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table id="slidesTable" class="table table-hover table-custom" style="width:100%">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tab Name</th>
                                <th>Category</th>
                                <th>Title</th>
                                <th>Image</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Create/Update -->
    <div class="modal fade" id="slideModal" tabindex="-1" aria-labelledby="slideModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content shadow-lg">
                <form id="addSlideForm" enctype="multipart/form-data">
                    <div class="modal-header py-3 px-4">
                        <h5 class="modal-title fw-bold" id="slideModalLabel">Add / Update Slide</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" name="id" id="slideId">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" name="tab_name" class="form-control" id="tabName" placeholder="Tab Name" required>
                                    <label for="tabName">Tab Name</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" name="tab_icon_path" class="form-control" id="tabIconPath" placeholder="Icon Path" required>
                                    <label for="tabIconPath">Tab Icon Path (e.g. files/images/icon.svg)</label>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" name="category" class="form-control" id="categoryName" placeholder="Category" required>
                                    <label for="categoryName">Category</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" name="link" class="form-control" id="linkUrl" placeholder="Link URL" value="#">
                                    <label for="linkUrl">Learn More Link</label>
                                </div>
                            </div>
                            
                            <div class="col-md-12">
                                <div class="form-floating">
                                    <input type="text" name="title" class="form-control" id="slideTitle" placeholder="Title" required>
                                    <label for="slideTitle">Slide Title</label>
                                </div>
                            </div>
                            
                            <div class="col-md-12 mt-4">
                                <label class="form-label fw-bold" style="color: #1e3b56; font-size: 14px;">Slide Image</label>
                                <div class="upload-area" id="uploadArea">
                                    <p class="mb-0 text-muted" id="uploadText" style="font-weight: 500;">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-cloud-arrow-up text-primary mb-2" viewBox="0 0 16 16">
                                            <path fill-rule="evenodd" d="M7.646 5.146a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708l2-2z"/>
                                            <path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383zm.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z"/>
                                        </svg><br>
                                        Drag & drop your image here or click to browse
                                    </p>
                                    <input type="file" name="image" id="imageInput" accept="image/*">
                                    <img id="imagePreview" class="preview-img mx-auto" alt="Preview">
                                </div>
                                <small class="text-muted d-block mt-2" style="font-size: 12px;">Leave empty to keep existing image when updating.</small>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer px-4 py-3 bg-light">
                        <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-custom px-4 fw-bold">Save Slide</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let dataTable;

        $(document).ready(function() {
            // Initialize DataTable
            dataTable = $('#slidesTable').DataTable({
                "pageLength": 5,
                "lengthMenu": [5, 10, 25],
                "language": {
                    "search": "_INPUT_",
                    "searchPlaceholder": "Search slides..."
                },
                "columns": [
                    { "data": "id" },
                    { "data": "tab_name", "className": "fw-bold" },
                    { 
                        "data": "category",
                        "render": function(data) {
                            return `<span class="badge bg-secondary opacity-75">${data}</span>`;
                        }
                    },
                    { 
                        "data": "title",
                        "render": function(data) {
                            return data.length > 40 ? data.substr(0, 40) + '...' : data;
                        }
                    },
                    { 
                        "data": "image_path",
                        "render": function(data) {
                            if (!data) return '<span class="text-muted">No Image</span>';
                            return `<img src="${data}" class="img-thumbnail border-0 shadow-sm" style="height: 40px; border-radius: 6px;" alt="img">`;
                        }
                    },
                    {
                        "data": null,
                        "className": "text-end",
                        "render": function(data, type, row) {
                            let rowJson = JSON.stringify(row).replace(/'/g, "\\'");
                            return `
                                <button class="btn btn-sm btn-outline-primary me-2" onclick='editSlide(${rowJson})'>Edit</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteSlide(${row.id})">Delete</button>
                            `;
                        }
                    }
                ]
            });

            loadSlides();
        });

        function loadSlides() {
            $.get('api.php', function(res) {
                if(res.status === 'success') {
                    dataTable.clear();
                    dataTable.rows.add(res.data);
                    dataTable.draw();
                }
            });
        }

        function openCreateModal() {
            resetForm();
            $('#slideModalLabel').text('Create New Slide');
            $('#slideModal').modal('show');
        }

        $('#addSlideForm').submit(function(e) {
            e.preventDefault();
            let formData = new FormData(this);
            
            let submitBtn = $(this).find('button[type="submit"]');
            let originalText = submitBtn.text();
            submitBtn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm me-2"></span>Saving...');

            $.ajax({
                url: 'api.php',
                type: 'POST', 
                data: formData,
                contentType: false,
                processData: false,
                success: function(res) {
                    submitBtn.prop('disabled', false).text(originalText);
                    if(res.status === 'success') {
                        $('#slideModal').modal('hide');
                        loadSlides();
                    } else {
                        alert(res.message);
                    }
                },
                error: function() {
                    submitBtn.prop('disabled', false).text(originalText);
                    alert("An error occurred during submission.");
                }
            });
        });

        $('#imageInput').change(function() {
            let file = this.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    $('#imagePreview').attr('src', e.target.result).show();
                    $('#uploadText').hide();
                }
                reader.readAsDataURL(file);
            } else {
                $('#imagePreview').hide();
                $('#uploadText').show();
            }
        });

        function editSlide(slide) {
            resetForm();
            $('#slideModalLabel').text('Edit Slide (ID: ' + slide.id + ')');
            
            $('#slideId').val(slide.id);
            $('#tabName').val(slide.tab_name);
            $('#tabIconPath').val(slide.tab_icon_path);
            $('#categoryName').val(slide.category);
            $('#slideTitle').val(slide.title);
            $('#linkUrl').val(slide.link);
            
            if (slide.image_path) {
                $('#imagePreview').attr('src', slide.image_path).show();
                $('#uploadText').hide();
            }

            $('#slideModal').modal('show');
        }

        function resetForm() {
            $('#addSlideForm')[0].reset();
            $('#slideId').val('');
            $('#imagePreview').hide().attr('src', '');
            $('#uploadText').show();
        }

        function deleteSlide(id) {
            if(confirm('Are you sure you want to delete this slide?')) {
                $.ajax({
                    url: 'api.php',
                    type: 'DELETE',
                    contentType: 'application/json',
                    data: JSON.stringify({id: id}),
                    success: function(res) {
                        loadSlides();
                    }
                });
            }
        }
    </script>
</body>
</html>
